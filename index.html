<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1a1220"><link rel="icon" href="icon-192.png">
<title>요괴록 — 조선 요괴 토벌기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&family=East+Sea+Dokdo&display=swap">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" async></script>
<style>
:root {
  --bg: #0b0a10; --bg2: #15121d; --panel: rgba(22, 18, 30, 0.94); --line: #352d45; --ink: #f1ebdf; --dim: #a39bb2;
  --gold: #ffb547; --gold2: #ffd98a; --gem: #8fe9ff; --hp: #e0534f; --xp: #b48cff; --good: #7fe08a;
  --display: "Do Hyeon", "Malgun Gothic", sans-serif; --body: "Gowun Dodum", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--body); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
input { font: inherit; }
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #07060a; touch-action: none; }

/* 공통 화면 */
.screen { position: fixed; inset: 0; display: flex; flex-direction: column; background: radial-gradient(ellipse at 50% 0%, #2a1f35 0%, var(--bg) 70%); z-index: 20; }
.screen .top { display: flex; align-items: center; gap: 10px; padding: 12px max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left)); border-bottom: 1px solid var(--line); background: rgba(10, 8, 14, 0.7); flex-wrap: wrap; }
.screen .top h2 { font-family: var(--display); font-weight: 400; font-size: 1.6rem; margin: 0; color: var(--gold); flex: 1; min-width: 120px; }
.screen .body { flex: 1; overflow: auto; padding: 16px max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left)); }
.money { display: flex; gap: 8px; }
.pill { border: 1px solid var(--line); background: var(--bg2); border-radius: 999px; padding: 4px 12px; font-size: 0.9rem; white-space: nowrap; }
.pill b { font-weight: 400; color: var(--gold2); }
.pill.coin b { color: var(--gem); }
.btn { background: linear-gradient(#3a2f4a, #2a2236); border: 1px solid #4d4060; border-radius: 10px; padding: 9px 16px; font-family: var(--display); font-size: 1.05rem; transition: transform 0.08s, border-color 0.15s; }
.btn:hover { border-color: var(--gold); }
.btn:active { transform: scale(0.97); }
.btn.gold { background: linear-gradient(#ffcf6a, #e89a2a); color: #2a1606; border-color: #ffe0a0; }
.btn.blue { background: linear-gradient(#5fc8ff, #2a7ac8); color: #061a2a; border-color: #a0e0ff; }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.sm { padding: 5px 10px; font-size: 0.9rem; }
.back { background: none; border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.tab { border: 1px solid var(--line); background: var(--bg2); border-radius: 999px; padding: 6px 14px; font-family: var(--display); font-size: 1rem; }
.tab.on { background: var(--gold); color: #2a1606; border-color: var(--gold); }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.muted { color: var(--dim); font-size: 0.9rem; }
h3 { font-family: var(--display); font-weight: 400; font-size: 1.25rem; margin: 0 0 8px; color: var(--gold2); }

/* 로그인 */
#login { align-items: center; justify-content: center; background: #000; }
#login .bgimg { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0.45; filter: blur(1px); }
#login .box { position: relative; width: min(380px, calc(100% - 32px)); background: rgba(14, 11, 20, 0.92); border: 1px solid #4d4060; border-radius: 18px; padding: 26px 22px; box-shadow: 0 20px 60px #000a, 0 0 40px rgba(255, 181, 71, 0.15); }
/* 11-17 하이엔드 타이틀 화면 */
#login { flex-direction: column; gap: 6px; overflow: hidden; }
#login .bgimg.kb { opacity: 0.62; filter: saturate(1.05) contrast(1.05); transform-origin: 60% 40%; animation: kb 38s ease-in-out infinite alternate; }
@keyframes kb { from { transform: scale(1.02) translate(0, 0); } to { transform: scale(1.14) translate(-1.5%, -1%); } }
#login .tfog { position: absolute; inset: -20%; background-size: 900px; opacity: 0.11; mix-blend-mode: screen; animation: tfog 70s linear infinite; pointer-events: none; filter: blur(1px) brightness(1.6); }
#login .tfog.f2 { background-size: 1400px; opacity: 0.08; animation-duration: 110s; animation-direction: reverse; }
@keyframes tfog { from { background-position: 0 0; } to { background-position: 1800px 300px; } }
#login #tparts { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#login .tvig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 35%, rgba(4,2,10,0.55) 75%, rgba(2,1,6,0.9) 100%); }
#login .tlogo { position: relative; width: min(560px, 82vw); max-height: 34vh; object-fit: contain; filter: drop-shadow(0 8px 30px rgba(0,0,0,0.7)); animation: tlogo 1.6s cubic-bezier(.2,.7,.2,1) both, tglow 5s ease-in-out 1.6s infinite; }
@keyframes tlogo { from { opacity: 0; transform: translateY(14px) scale(0.96); filter: blur(6px); } to { opacity: 1; transform: none; filter: drop-shadow(0 8px 30px rgba(0,0,0,0.7)); } }
@keyframes tglow { 0%,100% { filter: drop-shadow(0 8px 30px rgba(0,0,0,0.7)) brightness(1); } 50% { filter: drop-shadow(0 8px 30px rgba(0,0,0,0.7)) drop-shadow(0 0 22px rgba(255,170,70,0.35)) brightness(1.08); } }
#login .box { background: linear-gradient(180deg, rgba(20,15,28,0.78), rgba(10,8,16,0.86)); backdrop-filter: blur(10px) saturate(1.2); -webkit-backdrop-filter: blur(10px) saturate(1.2); border: 1px solid rgba(230,180,90,0.35); border-radius: 14px; padding: 18px 22px 16px; animation: tbox 1.2s ease .5s both;
  box-shadow: 0 24px 70px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,230,180,0.12), 0 0 0 1px rgba(0,0,0,0.6); }
#login .box::before, #login .box::after { content: ""; position: absolute; width: 18px; height: 18px; border: 2px solid rgba(240,190,100,0.75); pointer-events: none; }
#login .box::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; border-top-left-radius: 14px; }
#login .box::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; border-bottom-right-radius: 14px; }
@keyframes tbox { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
#login .field input { background: rgba(5,4,9,0.55); border: 1px solid rgba(160,130,190,0.28); transition: border-color .2s, box-shadow .2s; }
#login .field input:focus { border-color: rgba(255,200,110,0.85); box-shadow: 0 0 0 3px rgba(255,180,80,0.14), 0 0 18px rgba(255,170,60,0.18); }
#login .field label { color: #d9cbe6; letter-spacing: 0.04em; font-size: 0.92rem; }
@media (max-height: 520px) { /* 폰 가로: 왼쪽 로고, 오른쪽 입력 */
  #login { flex-direction: row; justify-content: center; align-items: center; gap: 3vw; overflow-y: auto; padding: 8px 12px; }
  #login .tlogo { width: 40vw; max-height: 70vh; }
  #login .box { width: min(360px, 50vw) !important; padding: 10px 14px !important; margin: 0 !important; font-size: 0.86rem; }
  #login .field { margin-top: 4px; } #login .field input { padding: 6px 10px; } #login .field label .muted { display: none; }
  #login .box p.muted { font-size: 0.72rem; margin-top: 6px !important; } #login .center .btn { transform: scale(0.88); } }
.logo { font-family: var(--display); font-size: 2.4rem; color: var(--gold); text-align: center; text-shadow: 0 0 24px rgba(255, 181, 71, 0.6); line-height: 1.1; }
.logo small { display: block; font-size: 1.1rem; color: var(--dim); margin-top: 4px; letter-spacing: 0.2em; }
.field { display: flex; flex-direction: column; gap: 4px; margin-top: 12px; }
.field input { background: #0b0a10; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; color: var(--ink); }
.field input:focus { outline: none; border-color: var(--gold); }
.err { color: #ff8a8a; min-height: 1.3em; font-size: 0.9rem; margin-top: 8px; }

/* 메인 메뉴 */
#menu .hero-bg { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0.22; pointer-events: none; }
#menu .body { position: relative; display: flex; flex-direction: column; align-items: center; gap: 18px; }
.modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; width: min(1100px, 100%); }
.mode { min-height: 150px; }
.mode { position: relative; overflow: hidden; border-radius: 18px; border: 1px solid #4d4060; min-height: 210px; padding: 16px; text-align: left; display: flex; flex-direction: column; justify-content: flex-end; background: #1a1424; transition: transform 0.12s, border-color 0.2s, box-shadow 0.2s; }
.mode:hover { transform: translateY(-3px); border-color: var(--gold); box-shadow: 0 10px 30px rgba(255, 181, 71, 0.2); }
.mode .img { position: absolute; inset: 0; background-size: cover; background-position: center 25%; opacity: 0.6; }
/* 11-17 하이엔드 메뉴 */
#menu .hero-bg.kb { opacity: 0.3; transform-origin: 50% 40%; animation: kb 44s ease-in-out infinite alternate; }
#menu .mparts { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.8; }
.mode { transform-style: preserve-3d; will-change: transform; transition: transform 0.18s ease-out, border-color 0.2s, box-shadow 0.25s; }
.mode .img { transition: transform 0.6s ease, opacity 0.3s, filter 0.3s; }
.mode:hover .img { transform: scale(1.07); opacity: 0.78; filter: saturate(1.15); }
.mode::before { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1; background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(255,220,150,0.22), rgba(255,200,120,0) 45%); opacity: 0; transition: opacity 0.25s; }
.mode:hover::before { opacity: 1; }
.mode::after { content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%; pointer-events: none; z-index: 1; background: linear-gradient(105deg, rgba(255,230,170,0) 0%, rgba(255,230,170,0.18) 50%, rgba(255,230,170,0) 100%); transform: skewX(-18deg); animation: msheen 6s ease-in-out infinite; }
.mode:nth-child(2)::after { animation-delay: 1s; } .mode:nth-child(3)::after { animation-delay: 2s; } .mode:nth-child(4)::after { animation-delay: 3s; } .mode:nth-child(5)::after { animation-delay: 4s; } .mode:nth-child(6)::after { animation-delay: 5s; }
@keyframes msheen { 0%, 70% { left: -60%; } 100% { left: 130%; } }
.mode > b, .mode > span { position: relative; z-index: 2; text-shadow: 0 2px 8px rgba(0,0,0,0.9); }
@media (prefers-reduced-motion: reduce) { #menu .hero-bg.kb, #login .bgimg.kb, .mode::after, #login .tfog { animation: none; } }
.mode::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 30%, rgba(8, 6, 12, 0.95)); }
.mode > * { position: relative; z-index: 1; }
.mode b { font-family: var(--display); font-weight: 400; font-size: 1.7rem; color: var(--gold2); }
.mode span { color: #d8d0e4; font-size: 0.9rem; }
.subs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; width: min(1000px, 100%); }
.sub { border: 1px solid var(--line); background: var(--panel); border-radius: 14px; padding: 12px; font-family: var(--display); font-size: 1.15rem; display: flex; align-items: center; gap: 10px; position: relative; }
.sub:hover { border-color: var(--gold); }
.sub .ic { font-size: 1.6rem; }
.dot { position: absolute; top: 8px; right: 10px; width: 10px; height: 10px; border-radius: 50%; background: #ff4d4d; box-shadow: 0 0 8px #ff4d4d; }
@media (max-width: 720px) { .modes { grid-template-columns: 1fr; } .mode { min-height: 120px; } .subs { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* 캐릭터 */
.chars { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); align-content: start; align-self: start; }
.ch { position: relative; border-radius: 12px; overflow: hidden; border: 2px solid var(--line); aspect-ratio: 3 / 4; background: #111 center / cover; padding: 0; }
.ch.on { border-color: var(--gold); box-shadow: 0 0 18px rgba(255, 181, 71, 0.5); }
.ch.lock { filter: grayscale(1) brightness(0.32); }
.ch .nm { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 6px 6px; background: linear-gradient(transparent, rgba(0, 0, 0, 0.92)); font-family: var(--display); font-size: 1rem; text-align: center; }
.ch .nm small { display: block; color: var(--dim); font-family: var(--body); font-size: 0.72rem; }
.ch .tag { position: absolute; top: 6px; left: 6px; font-size: 0.7rem; padding: 2px 6px; border-radius: 6px; background: rgba(0, 0, 0, 0.7); }
.ch .lk { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 2rem; filter: none; }
.charwrap { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; }
@media (max-width: 900px) { .charwrap { grid-template-columns: 1fr; } }
.detail { position: sticky; top: 0; align-self: start; }
.detail .big { width: 100%; aspect-ratio: 3 / 4; max-height: 380px; border-radius: 14px; background: #111 center / cover; border: 1px solid var(--line); position: relative; }
.detail .big .spr { position: absolute; right: 8px; bottom: 8px; width: 110px; height: 110px; background: center / contain no-repeat; filter: drop-shadow(0 6px 10px #000); }
.skl { display: grid; grid-template-columns: 42px 1fr; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.skl .k { width: 42px; height: 42px; border-radius: 10px; background: #221c2c; border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 1.2rem; line-height: 1; }
.skl .k small { font-size: 0.65rem; color: var(--gold2); margin-top: 2px; font-family: var(--display); }
.skl b { font-family: var(--display); font-weight: 400; }
.grade { display: inline-block; min-width: 22px; text-align: center; border-radius: 6px; font-family: var(--display); font-size: 0.85rem; padding: 0 5px; color: #111; }
.stars { color: var(--gold); letter-spacing: 2px; }
.prog { height: 8px; border-radius: 99px; background: #241d2e; overflow: hidden; margin-top: 6px; }
.prog > i { display: block; height: 100%; background: linear-gradient(90deg, #ffb547, #ffe08a); }

/* 가챠 */
.banner { border-radius: 16px; padding: 18px; border: 1px solid #4d4060; background: linear-gradient(135deg, #2a1f3a, #15121d); position: relative; overflow: hidden; }
.banner .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.rates { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; font-size: 0.85rem; }
.reveal { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; width: min(760px, 100%); }
@media (max-width: 600px) { .reveal { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.rv { aspect-ratio: 3 / 4; border-radius: 12px; border: 2px solid; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; padding: 6px; background: #120f18 center / cover; position: relative; animation: flip 0.5s both; overflow: hidden; }
.rv .ico { font-size: 2.4rem; }
.rv img { width: 70%; aspect-ratio: 1; object-fit: contain; }
.rv .t { font-family: var(--display); font-size: 0.95rem; text-shadow: 0 1px 3px #000; position: relative; }
.rv .new { position: absolute; top: 5px; right: 6px; font-size: 0.7rem; background: #ff4d6a; color: #fff; border-radius: 6px; padding: 1px 5px; }
@keyframes flip { from { transform: rotateY(90deg) scale(0.8); opacity: 0; } to { transform: none; opacity: 1; } }

/* 보관함 */
.item { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); position: relative; min-height: 150px; }
.item img { width: 64px; height: 64px; object-fit: contain; }
.autochk { display: block; text-align: center; margin: 8px 0 2px; color: #cbbfa8; font-size: .92rem; cursor: pointer; } .autochk input { vertical-align: middle; margin-right: 4px; accent-color: #e0a13e; }
.gcount { display: flex; align-items: baseline; justify-content: center; gap: 6px; margin: 4px 0 8px; font-family: var(--display); }
.gcount b { font-size: 2.2rem; color: var(--gold2); } .gcount span { font-size: 1.3rem; color: #cbbfa8; } .gcount small { font-family: inherit; font-size: .95rem; color: #9fd4a0; margin-left: 8px; }
.grcount { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 10px; } .grcount span { border: 1px solid; border-radius: 999px; padding: 2px 10px; font-size: .85rem; background: rgba(0,0,0,.3); }
.tab small { opacity: .8; font-size: .78em; margin-left: 3px; margin-right: 6px; white-space: nowrap; }
.skin .tab:has(small) { padding-right: 12px; }
.jobtree { display: grid; gap: 6px; margin: 6px 0; } .jobrow { display: grid; grid-template-columns: 64px 1fr 1fr; gap: 6px; align-items: stretch; }
.jobrow .lv { display: flex; flex-direction: column; justify-content: center; align-items: center; border-radius: 8px; background: rgba(255,181,71,.08); border: 1px solid rgba(255,181,71,.3); font-size: .78rem; color: #cbbfa8; } .jobrow .lv b { color: var(--gold2); font-family: var(--display); font-size: 1rem; }
.jobrow .jb { border-radius: 8px; padding: 6px 8px; background: linear-gradient(160deg, rgba(255,255,255,.05), rgba(0,0,0,.35)); border: 1px solid; font-size: .74rem; line-height: 1.4; color: #cbbfa8; }
.jobrow .jb.atk { border-color: #ff6a5a66; } .jobrow .jb.def { border-color: #5fc8ff66; }
.jobrow .jb b { display: block; font-size: .92rem; font-family: var(--display); } .jobrow .jb.atk b { color: #ffa08a; } .jobrow .jb.def b { color: #8fd8ff; }
.jobrow .jb i { display: block; font-style: normal; color: #ffd98a; margin-top: 3px; font-size: .7rem; }
/* 캐릭터 상세 탭 (11-13 다시 그림: 늘어난 장식 버튼 대신 옻칠 판 위 금박 탭) */
.ctabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; margin: 10px 0 6px; padding: 4px; border-radius: 12px; background: linear-gradient(180deg, #1d1420, #110b14); border: 1px solid #5a4126; box-shadow: inset 0 1px 0 #ffffff10, 0 4px 12px #0008; }
.ctab { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 4px; border: 0; background: none; color: #b9a98c; font-family: var(--display); font-size: 1.02rem; border-radius: 9px; cursor: pointer; position: relative; transition: background .2s, color .2s; }
.ctab .cti { font-size: 1.15rem; filter: grayscale(.6) brightness(.85); transition: filter .2s; } .ctab .cti img { width: 24px; height: 24px; vertical-align: middle; }
.ctab:hover { color: #f3dfb0; background: #ffffff08; }
.ctab.on { color: #2a1404; background: linear-gradient(180deg, #ffd98a, #e0a13e 60%, #b7782a); box-shadow: 0 0 14px #ffb54766, inset 0 1px 0 #fff6; }
.ctab.on .cti { filter: none; }
.ctab + .ctab::before { content: ""; position: absolute; left: 0; top: 22%; bottom: 22%; width: 1px; background: #5a4126; } .ctab.on::before, .ctab.on + .ctab::before { display: none; }
/* 전직 고르기 카드 */
.jpicks { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 10px; }
.jpk { display: flex; flex-direction: column; text-align: left; padding: 0; border-radius: 14px; overflow: hidden; border: 2px solid; background: #120c16; color: #e8dcc4; cursor: pointer; transition: transform .15s, box-shadow .15s; }
.jpk.atk { border-color: #ff6a5a; } .jpk.def { border-color: #5fc8ff; } .jpk:hover { transform: translateY(-3px); } .jpk.atk:hover { box-shadow: 0 0 24px #ff6a5a88; } .jpk.def:hover { box-shadow: 0 0 24px #5fc8ff88; }
.jpk .jart { position: relative; height: 190px; overflow: hidden; }
.jtx { padding: 10px 12px 12px; } .jtx small { color: #b9a98c; } .jtx b { display: block; font-family: var(--display); font-size: 1.4rem; margin: 2px 0 4px; } .jpk.atk .jtx b { color: #ffa08a; } .jpk.def .jtx b { color: #8fd8ff; }
.jtx p { margin: 3px 0; font-size: .85rem; } .jtx .jsk { color: #ffd98a; }
.jimg { width: 100%; height: 100%; object-fit: cover; }
.jfall { position: absolute; inset: 0; background-size: cover; background-position: center 25%; filter: saturate(1.1) brightness(.75); }
.jfall::after { content: ""; position: absolute; inset: 0; } .jfall.atk::after { background: radial-gradient(circle at 50% 70%, #ff6a3a66, transparent 60%), linear-gradient(0deg, #120c16, transparent 60%); } .jfall.def::after { background: radial-gradient(circle at 50% 70%, #3aa8ff66, transparent 60%), linear-gradient(0deg, #120c16, transparent 60%); }
.jspr { position: absolute; left: 50%; bottom: 0; height: 92%; transform: translateX(-50%); filter: drop-shadow(0 0 12px #fff8); }

.bar { position: relative; height: 14px; border-radius: 7px; background: #2a1a1f; overflow: hidden; margin-top: 4px; }
.bar > i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(#ff7a6a, #c0302a); }
.bar > s { position: absolute; inset: 0 auto 0 0; background: rgba(150, 210, 255, 0.6); }

.bar > b.lag { position: absolute; inset: 0 auto 0 0; background: linear-gradient(#fff6e0, #ffc9a0); opacity: 0.85; transition: none; }
.bar > i { box-shadow: inset 0 -3px 6px rgba(0,0,0,0.35), 0 0 10px rgba(255,90,70,0.35); transition: width 0.08s linear; }
.bar > i::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 45%; background: linear-gradient(rgba(255,255,255,0.38), rgba(255,255,255,0.05)); border-radius: 7px 7px 0 0; }
.bar.hp { border: 1px solid rgba(255,190,150,0.25); box-shadow: inset 0 2px 4px rgba(0,0,0,0.6); }
.bar.hp.low > i { animation: hplow 0.8s ease-in-out infinite alternate; }
@keyframes hplow { from { filter: brightness(1); } to { filter: brightness(1.5) saturate(1.3); } }

.stage { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); text-align: center; font-family: var(--display); font-size: 1.15rem; background: rgba(10, 8, 14, 0.7); border: 1px solid var(--line); border-radius: 12px; padding: 4px 16px; white-space: nowrap; }
.bossbar { position: absolute; left: 50%; top: 52px; transform: translateX(-50%); width: min(620px, 60vw); text-align: center; font-family: var(--display); }

/* 움직이는 카드 (가챠·캐릭터) */

}

  .modes { gap: 6px; }
